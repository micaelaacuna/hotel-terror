STAY_LENGTH = A stay must run from 1 to 30 nights, with check-out after check-in.
SUN_INCOMPATIBLE = Room {0} has full sun exposure. This guest would not survive check-out.
SUN_PARTIAL_WARNING = Room {0} gets partial daylight. Advise the guest to keep the curtains drawn.
TEMP_TOO_WARM = Room {0} is too warm for this guest; they would not last the night.
ROOM_OVERLAP = Room {0} is already booked for those dates.
CHECKIN_BAD_STATE = Only a confirmed booking can be checked in.
CHECKOUT_BAD_STATE = Only a checked-in guest can be checked out.
CANCEL_BAD_STATE = This booking can no longer be cancelled.
BOOKING_LOCKED = A checked-out or cancelled booking can no longer be changed.
BOOKING_IN_HOUSE_DELETE = A checked-in booking cannot be deleted; check the guest out first.
ROOM_HAS_BOOKINGS = Room {0} still has bookings and cannot be deleted.
