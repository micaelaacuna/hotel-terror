STAY_LENGTH = Una estancia debe durar de 1 a 30 noches, con la salida posterior a la entrada.
SUN_INCOMPATIBLE = La habitacion {0} tiene exposicion solar plena. Este huesped no sobreviviria al dia.
SUN_PARTIAL_WARNING = La habitacion {0} recibe luz diurna parcial. Recomiende al huesped mantener las cortinas cerradas.
TEMP_TOO_WARM = La habitacion {0} es demasiado calida para este huesped; no aguantaria la noche.
ROOM_OVERLAP = La habitacion {0} ya esta reservada para esas fechas.
CHECKIN_BAD_STATE = Solo una reserva confirmada puede registrar la entrada.
CHECKOUT_BAD_STATE = Solo un huesped con entrada registrada puede registrar la salida.
CANCEL_BAD_STATE = Esta reserva ya no se puede cancelar.
BOOKING_LOCKED = Una reserva con salida registrada o cancelada ya no se puede modificar.
BOOKING_IN_HOUSE_DELETE = Una reserva con entrada registrada no se puede eliminar; registre primero la salida del huesped.
ROOM_HAS_BOOKINGS = La habitacion {0} todavia tiene reservas y no se puede eliminar.
